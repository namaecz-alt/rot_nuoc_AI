; =====================================================================
;  MAY ROT NUOC TU DONG - PROJECT PLATFORMIO (ESP32 / Arduino framework)
; ---------------------------------------------------------------------
;  Cau truc chuan cua PlatformIO:
;     src/    firmware that (main.cpp = vong loop Arduino)
;     test/   unit test chay tren PC (khong can nap ESP32)
;     host/   lop mo phong GPIO/UART de bien dich firmware tren PC
;
;  Lenh thuong dung:
;     pio run -e esp32dev                        # bien dich
;     pio run -e esp32dev -t upload              # nap qua cong USB tu dong
;     pio run -e esp32dev -t upload --upload-port COM5
;     pio device monitor -b 115200               # xem khung tin UART
;     pio test -e native                         # 88 unit test tren PC
;     pio run -t envdump                         # xem bien moi truong
;
;  Neu may chua co PlatformIO:  pip install platformio
;  (hoac dung Makefile trong thu muc nay - chi can g++, khong can PIO)
; =====================================================================
[platformio]
default_envs = esp32dev
name = cup_filler_esp32
description = May rot nuoc tu dong: cam bien coc + nut bam + mic + relay bom, noi may tinh bang UART

; ---------------------------------------------------------------------
; Tham so chung cho moi moi truong
; ---------------------------------------------------------------------
[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; day la cho duy nhat can sua neu ban doi so chan / thoi gian:
    ; -DPIN_RELAY_PUMP=23
    ; -DPIN_CUP_SENSOR=32
    ; -DRELAY_ACTIVE_HIGH=1
    ; -DCUP_ACTIVE_LEVEL=0
    ; -DBTN_ACTIVE_LEVEL=0
    ; -DVOICE_MODE=1

; ---------------------------------------------------------------------
; ESP32 DevKit V1 / NodeMCU-32S  (mac dinh cua du an)
; ---------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_flash = 40000000L
build_flags = ${env.build_flags}

; ---------------------------------------------------------------------
; ESP32-S3 + mic I2S INMP441 + ESP-SR (nhan lenh giong noi offline)
; CAN: board co PSRAM, partition co chua model esp-sr.
; Xem src/voice_input_espsr.cpp (file nay chua duoc bien dich trong repo).
; ---------------------------------------------------------------------
[env:esp32s3-sr]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DVOICE_MODE=3
    -DUSE_ESP_SR=1
lib_deps =
    espressif/esp-sr

; ---------------------------------------------------------------------
; Unit test chay tren PC (khong co ESP32): bien dich dung phan logic
; cua firmware (uart_protocol, device_fsm, voice_input) + GPIO ao.
;     pio test -e native
; Khong dung Arduino framework nen khong can toolchain ESP32.
; ---------------------------------------------------------------------
[env:native]
platform = native
build_type = debug
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Isrc
    -I.
; chi lay logic firmware + lop GPIO ao; KHONG lay host/host_main.cpp
; (file do co main() rieng cho "ESP32 ao")
build_src_filter =
    +<*>
    -<main.cpp>
    +<../host/board_io_host.cpp>
; test/test_firmware/test_firmware.cpp tu viet main() -> khong can Unity

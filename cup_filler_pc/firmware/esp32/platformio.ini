; =====================================================================
;  PlatformIO cho firmware ESP32 (tuy chon - dung Arduino IDE cung duoc)
;
;    cd cup_filler_pc/firmware/esp32
;    pio run -t upload --upload-port COM5      ; nap
;    pio device monitor -b 115200              ; xem khung tin (khuyen cao
;                                              ; dung tools/run_esp.py --monitor)
; =====================================================================
[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
; chi bien dich firmware, bo qua thu muc mo phong / unit test tren PC
build_src_filter = +<*> -<host/> -<test/>

; ---- ESP32-S3 + mic I2S INMP441 + ESP-SR (nhan lenh giong noi offline) ----
; [env:esp32s3-sr]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino, espidf
; board_build.arduino.memory_type = qio_opi
; build_flags =
;     -DUSE_ESP_SR=1
;     -DBOARD_HAS_PSRAM
; build_src_filter = +<*> -<host/> -<test/>
; lib_deps = espressif/esp-sr

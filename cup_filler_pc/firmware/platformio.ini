; ============================================================================
;  platformio.ini - NẠP FIRMWARE BẰNG VS CODE + PLATFORMIO
;  Board: ESP32 DevKit V1 (board_id "esp32dev" = ESP32-WROOM-32, 30 chân)
;
;  DÙNG TRONG VS CODE
;    1. Cài extension "PlatformIO IDE" (mở VS Code ▸ Extensions ▸ tìm PlatformIO)
;    2. File ▸ Open Folder... ▸ chọn đúng thư mục này (cup_filler_pc/firmware)
;    3. Ở thanh dưới cùng chọn môi trường "esp32dev" (mặc định, dùng UART2)
;    4. Bấm ✓ (Build) rồi → (Upload); mở Serial Monitor bằng phích cắm (115200)
;
;  DÒNG LỆNH TƯƠNG ĐƯƠNG
;    pio run                                  # biên dịch
;    pio run -t upload                        # nạp (env esp32dev)
;    pio device monitor                       # xem log tiếng Việt (115200)
;    pio run -e esp32dev_usb -t upload         # nếu KHÔNG có mạch USB-TTL
;    pio run -t erase                          # xoá flash (khi board "cứng đầu")
;
;  Chân GPIO, tốc độ bơm, preset ml... nằm trong esp32_cup_filler/config.h.
; ============================================================================

[platformio]
; Firmware Arduino nằm cùng thư mục với các .h của nó; host_test/ KHÔNG được build
; ở đây (bộ test trên PC dùng g++ của máy tính - xem ../firmware/README.md §10).
src_dir = esp32_cup_filler
description = Firmware ESP32 DevKit V1 cho máy rót nước (UART với phần mềm PC)

[env]
platform = espressif32                  ; Arduino core cho ESP32 (bản 6.x = core 2.0.x)
board = esp32dev                        ; = ESP32 DevKit V1 (ESP32-WROOM-32)
framework = arduino
monitor_speed = 115200                  ; khớp DEBUG_SERIAL: Serial.begin(115200) trong setup()
upload_speed = 921600                   ; nếu nạp hay lỗi: giảm xuống 460800
                                            ; (hoặc giữ nút BOOT khi thấy "Connecting...")

; ---------------------------------------------------------------------------
;  Mặc định: ESP nói chuyện với PC qua UART2 (GPIO16/17) + mạch USB-TTL.
;  Cổng USB của board để xem log (Serial Monitor 115200).
; ---------------------------------------------------------------------------
[env:esp32dev]

; ---------------------------------------------------------------------------
;  Không có mạch USB-TTL: nói chuyện với PC bằng CHÍNH cổng USB của board.
;  Env này bật UART_USE_USB_SERIAL=1 và PHẢI tắt DEBUG_SERIAL (một cổng USB
;  không thể vừa in log vừa gửi gói tin).
;  Sau khi nạp: đóng Serial Monitor rồi chạy phần mềm PC:
;      python3 tools/web.py --port COM5        (baud 921600 - xem config/settings.yaml)
;  Lưu ý: mỗi lần PC mở cổng COM, board bị reset (chân DTR/RTS) - firmware tự
;  khởi động lại và gửi HELLO, chỉ chậm ~0,5 s.
; ---------------------------------------------------------------------------
[env:esp32dev_usb]
build_flags = -DUART_USE_USB_SERIAL=1 -DDEBUG_SERIAL=0
monitor_speed = 921600                  ; cổng này là kênh DỮ LIỆU 921600, không phải log

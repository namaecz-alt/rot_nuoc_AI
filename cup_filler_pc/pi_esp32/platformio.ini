; ============================================================================
;  platformio.ini - FIRMWARE ESP32 NOI RASPBERRY PI (UART2 + I2S AUDIO)
;  Board: ESP32 DevKit V1 / ESP32-WROOM-32 30 chan
;
;  VS Code:
;    1. Cai extension PlatformIO IDE
;    2. File > Open Folder > chon cup_filler_pc/pi_esp32
;    3. Chon env "esp32dev_pi" o thanh trang thai duoi cung
;    4. Build (check) -> Upload (mui ten) -> Serial Monitor (phich cam, 115200)
;
;  Ma nguon nam o ../firmware/esp32_pi_link:
;    esp32_pi_link.ino  - may trang thai + xu ly lenh Pi
;    pi_config.h        - SO DO CHAN / baud 961000 / thong so an toan
;    pi_link.h          - UART2 GPIO16/17 noi Pi
;    pi_protocol.h      - INPUT_STATE + SPEAKER_AUDIO mo rong
;    audio_duplex.h     - INMP441 mic + MAX98357A loa
;    inputs.h           - cam bien GPIO34 + START GPIO26 + 3 nut muc
;    pump_pi.h          - relay GPIO27 va chot an toan
;
;  Ban nay KHONG thay ban PC cu o ../serial_esp32/platformio.ini.
; ============================================================================

[platformio]
src_dir = ${PROJECT_DIR}/../firmware/esp32_pi_link
description = ESP32 DevKit V1 bridge for Raspberry Pi: IO + pump + I2S audio

[env]
platform = espressif32 @ ^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:esp32dev_pi]
; Mac dinh cho Raspberry Pi: du lieu chi qua UART2 GPIO16/17, USB xem log.
; Chi build dung sketch Pi. Ghi ca ten .ino va .ino.cpp vi PlatformIO doi ten
; trong luc build; cac file main() cua host_test/ khong bao gio bi nap vao ESP.
build_src_filter = +<esp32_pi_link.ino> +<esp32_pi_link.ino.cpp>

[env:esp32dev_pi_usb]
; Test bang may tinh qua chinh cap USB cua board (khong can USB-TTL).
; Cong COM cua board se truyen AA55 o 961000 baud, khong con log chu 115200.
build_flags = -DPI_LINK_TRANSPORT=2
build_src_filter = +<esp32_pi_link.ino> +<esp32_pi_link.ino.cpp>
monitor_speed = 961000

[env:esp32dev_pi_auto]
; Nghe ca USB board lan UART2; cong host gui khung hop le truoc se duoc chon.
; USB luc nay la kenh du lieu 961000 baud, khong con log chu 115200.
build_flags = -DPI_LINK_TRANSPORT=0
build_src_filter = +<esp32_pi_link.ino> +<esp32_pi_link.ino.cpp>
monitor_speed = 961000
